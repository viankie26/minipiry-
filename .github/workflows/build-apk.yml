name: Build Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Minipiry APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure pre-installed Android SDK & accept licenses
        run: |
          ANDROID_SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_DIR" >> "$GITHUB_ENV"
          sudo chmod -R a+rwx "$ANDROID_SDK_DIR"
          SDKMANAGER=$(find "$ANDROID_SDK_DIR/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_DIR" --licenses > /dev/null || true
          fi

      - name: Install Gradle 9.3.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Restore Firebase-registered debug keystore & default .env
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Assemble Android APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare minipiry.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk minipiry.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: minipiry-apk
          path: minipiry.apk
          if-no-files-found: error

      - name: Publish direct APK download to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest minipiry.apk --clobber
          else
            gh release create latest minipiry.apk \
              --target "${{ github.sha }}" \
              --title "超简到期 Minipiry Android APK" \
              --notes "直接点击下方 minipiry.apk 下载到 Android 手机安装即可（已内置与 Firebase 匹配的签名证书，支持 Google 一键登录与云端同步）。"
          fi
